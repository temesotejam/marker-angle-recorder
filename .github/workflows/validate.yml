name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/marker.js
          node --check src/rwlog.js
          node --check src/zip.js
      - name: Check required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f .nojekyll
          test -f docs/RWLOG_COMPATIBILITY.md
          grep -q 'src/app.js' index.html
          grep -q 'Absolute · fixed horizontal' index.html
          grep -q 'Marker Angle Session Recorder' README.md
